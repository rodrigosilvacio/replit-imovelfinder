kind = "web"
previewPath = "/"
title = "Monitor de Casas Mais Baratas"
version = "1.0.0"
id = "artifacts/monitor-casas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22523

[services.development]
run = "pnpm --filter @workspace/monitor-casas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/monitor-casas", "run", "build" ]
publicDir = "artifacts/monitor-casas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22523"
BASE_PATH = "/"
